<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <style>
    * {
      font-family: "Poppins", sans-serif;
      margin: 0px;
      padding: 0px;
    }

    .card {
      border: 1px solid #00000033;
      padding: 35px 37px 30px 43px;
      border-radius: 30px;
      max-width: 424px;
      transition: all 300ms linear;
      position: relative;
    }


    .mt {
      margin-top: 17px;
    }

    .btn {
      font-weight: 600;
      line-height: 150%;
      background-color: white;
      border-radius: 23px;
      color: grey;
      border: 1px solid transparent;
      padding: 11px 28px;
      margin-top: 32px;
      cursor: pointer;
      min-width: 134px;
    }
    .btn:hover{
      color: white;

            background-color: #2C49FE;
    }

    .container {
      max-width: 1322px;
      margin: auto;

    }

    .image {
      border-radius: 20px;
      width: 344px;
      height: 252px;
      opacity: 1;


    }

    .subhead {
      font-weight: 600;
      font-size: 24px;
      margin-top: 10px;
      margin-bottom: 8px;
      color: #000000;
      line-height: 150%;
    }

    .data-flex {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    .heading {
      display: flex;
      font-weight: 700;
      font-size: 48px;
      line-height: 100%;

      text-align: center;
      width: 582px;
      margin-bottom: 33px;

    }

    .head {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      min-height: 100vh;
    }

    .data {
      font-weight: 400;
      font-size: 16px;
      line-height: 150%;
      border: 1px solid #00000033;

    }

    .dataC {
      color: grey;
      font-weight: 400;
      font-size: 16px;
      line-height: 150%;

    }



    .section {
      align-items: center;
      justify-content: center;
      flex-direction: row;
    }


    .row {
      display: flex;
      justify-content: center;
      gap: 25px;
      max-width: 1322px;

    }

    .card:hover {
      border: 1px solid blue;
      box-shadow: 0px 8px 35px 0px #0000001A;

    }

    @media (max-width:992px) {
      .row {
        flex-wrap: wrap;
      }
    }

    @media (max-width:992px) {
      .card {
        flex-wrap: wrap;
        flex-direction: column;
      }

    }
  </style>

</head>

<body>
