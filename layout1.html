<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Acme&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
    <style>
        .para {
            font-family: "Acme", sans-serif;
            font-weight: 400;
            font-style: normal;

            font-weight: 400;
            font-size: 70px;
            line-height: 90px;
            text-align: center;
            color: white;
            max-width: 1207px;
        }

        .main-parent {
            background-color: black;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gradient-text {
            background: #3d0d0d;
            background: linear-gradient(90deg, rgba(61, 13, 13, 1) 0%, rgba(0, 201, 94, 1) 50%, rgba(255, 255, 82, 1) 100%);
            background-clip: text;
            color: transparent;
        }
    </style>
</head>

<body>
    <div class="main-parent">
        <p class="para">Stress doesn't come from <span class="gradient-text">HARD WORK</span> ,Stress primarily comes
            from not taking action over something that you can have some control over,So stress comes from Ignoring
            things that you shouldn't be ignoring.</p>
    </div>

</body>

</html>
