<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: "Plus Jakarta Sans", sans-serif;
            padding: 0;
            margin: 0;
            color: white;
        }

        .container {
            margin: 0 auto;
            position: relative;
            width: 1140px;
            border-radius: 24px;
            overflow: hidden;
            height: 447px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url(house.png);
            background-size: 1140px 447px;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container::before {
            position: absolute;
            content: "";
            inset: 0;


            background: rgba(255, 0, 0, 0.72);
        }

        body {
            background: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .btn {
            font-family: Plus Jakarta Sans;
            font-weight: 700;
            font-style: Bold;
            font-size: 18px;
            line-height: 100%;
            letter-spacing: 0%;
            text-transform: capitalize;

        }

        h1 {
            font-weight: 600;
            font-style: SemiBold;
            font-size: 56px;
            line-height: 100%;
            letter-spacing: 0%;
            text-align: center;
            text-transform: capitalize;
            width: 547px;
            height: 142px;
            opacity: 1;
            position: relative;

        }


        head {

            margin-bottom: 20px;
            font-weight: 600;
            font-size: 56px;
            line-height: 100%;
            letter-spacing: 0%;
            text-align: center;
            text-transform: capitalize;
            color: #FFFFFF;

        }

        p {
            font-weight: 400;
            font-style: Regular;
            font-size: 18px;
            line-height: 160%;
            letter-spacing: 0%;
            text-align: center;
            max-width: 592px;
            height: 58px;
            opacity: 1;
            margin-bottom: 36px;
            width: 100%;



        }

        .row {
            z-index: 1;
            max-width: 592px;
            top: 64px;
            left: 274px;
            opacity: 1;
            gap: 36px;
            text-align: center;
            width: 100%;


        }

        button {
            max-width: 173px;
            height: 63px;
            border-radius: 56px;
            opacity: 1;
            gap: 10px;
            border: 1px solid white;
            color: black;
            border-color: #fff;
            width: 100%;
            padding:20px 32px 20px 32px ;

        }

        button:hover {
            color: red;
        }
    </style>
</head>

<body>
    <section>
        <div class="container">
            <div class="row">
                <h1 class="heading">
                    Interested? <br>Get in touch with us
                </h1>
                <p>Lörem ipsum koda astrobel: sutaveligen. Rodod bänera viliga. Pregigt primasofi dede facebooka:
                    förutom tivaligt. </p>

                <button>Get a Quote</button>


            </div>
        </div>




    </section>
</body>

</html>
