<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inconsolata:wght@200..900&display=swap"
        rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: "DM Sans", sans-serif;
            color: #1E0E62;
            box-sizing: border-box;
            text-decoration: none;
        }

        .container {
            margin: 0 auto;
            text-align: center;
            max-width: 971px;
            width: 100%;

            padding: 0px 20px;
        }

        body {
            background: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }


        h1 {
            font-weight: 700;
            font-size: 42px;
            line-height: 52px;
            letter-spacing: -0.4px;
            opacity: 1;
            text-align: left;
        }

        .h2 {
            font-weight: 700;
            font-size: 42px;
            line-height: 52px;
            letter-spacing: -0.4px;
            opacity: 1;
            text-align: left;
            margin-bottom: 25px;
        }

        p {
            font-weight: 400;
            font-size: 16px;
            line-height: 26px;
            letter-spacing: 0px;
            max-width: 355px;
            opacity: 1;
            color: #15143966;
            text-align: left;
            margin-bottom: 34px;
        }

        .cards {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 130px;
            flex-direction: row;
        }

        .card1 {
            max-width: 368px;
            width: 100%;
            opacity: 1;
            border-bottom: 2px solid #EBEAED;
            margin-bottom: 44px;
        }

        span {
            font-weight: 500;
            font-size: 18px;
            line-height: 28px;
            color: #1E0E62;
            flex-direction: column;
        }

        .card2 {
            max-width: 370px;
            opacity: 1;
        }

        h2 {
            font-weight: 500;
            font-size: 22px;
            line-height: 32px;
            letter-spacing: 0px;
            flex-direction: column;
            text-align: left;
        }

        .col2 {
            max-width: 470px;
            width: 100%;

        }

        .card3 {
            max-width: 470px;
            opacity: 1;
            flex-direction: column;
            border-radius: 10px;
        }


        form {
            background: #F4F4F6;
            padding: 50px 50px 50px;
            border-radius: 10px;
            width: 100%;
            max-width: 470px;
            height: 550px;
            margin-bottom: 20px;
        }


        .col1 {
            max-width: 370px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-direction: column;
        }

        .box {
            max-width: 970px;
            width: 100%;
            overflow-x: auto;
        }

        input {
            border: none;
            width: 100%;
            height: 50px;
            opacity: 1;
            border-radius: 100px;
            border-width: 1px;
            padding-left: 15px;
            max-width: 270px;
            outline: none;
        }

        .dot {
            max-width: 370px;
            display: flex;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        textarea {
            resize: none;
            max-width: 370px;
            border-radius: 10px;
            border-width: 2px;
            height: 170px;
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;


        }



        .mail {
            font-weight: 700;
            font-size: 14px;
            line-height: 26px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;

        }

        .message {
            font-weight: 700;
            font-size: 14px;
            line-height: 26px;
            margin-top: 37px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .name {
            font-weight: 700;
            font-size: 14px;
            line-height: 26px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 37px;
        }

        input,
        textarea {
            color: grey;
            box-sizing: border-box;

        }

        .bottom-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        iframe {
            border-radius: 10px;
        }

        button {
            background: #25DAC5;
            border: none;
            height: 50px;
            padding: 0 25px;
            border-radius: 100px;
            cursor: pointer;
            font-size: 16px;
            color: #1E0E62;
        }

        .para {
            margin-top: 20px;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .pose {
            max-width: 90px;
            height: 50px;
            color: white;
        }



        @media (max-width:700px) {
            .cards {
                flex-direction: column;
                gap: 50px;
            }

            .line {
                display: none;
            }
        }

        @media (max-width: 320px) {

            body {
                padding: 20px 10px;
            }

            h1 {
                font-size: 28px;
                line-height: 35px;
            }

            .container {
                padding: 0 10px;
            }

            form {
                padding: 20px 15px;
                height: auto;
            }

            input,
            textarea,
            .dot,
            button,
            .pose {
                width: 100%;
                max-width: 100%;
                color: white;

            }

            button {
                width: 100%;
                max-width: 100%;
                color: white;

            }

            iframe {
                width: 100%;
                height: 180px;
            }

            .contact-item {
                flex-wrap: wrap;
                word-break: break-word;
            }

            .contact-item a {
                overflow-wrap: break-word;
            }
        }
    </style>
</head>

<body>
    <section>
        <div class="container">
            <div class="cards">
                <div class="col1">
                    <div class="card1">
                        <h1 style="margin-bottom: 25px;">Get in Touch</h1>
                        <p>We appreciate each customer and we are <br class="line"> proud that 60% of clients come back
                            to work <br class="line">
                            with us
                            again.
                        </p>
                        <div class="contact-item" style="text-align: left;">
                            <svg width="15" height="15" viewBox="0 0 15 15" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path

                        </div>

                        <div class="contact-item" style="text-align: left;margin-bottom: 39px">
                            <svg width="18" height="15" viewBox="0 0 18 15" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M18 4.56006C17.6987 4.89153 17.3571 5.18283 16.9955 5.43394C15.3181 6.56899 13.6306 7.71408 11.9933 8.89934C11.1496 9.52211 10.1049 10.2855 9.01005 10.2855H9H8.98996C7.89509 10.2855 6.85045 9.52211 6.0067 8.89934C4.36942 7.70403 2.68192 6.56899 1.01451 5.43394C0.642857 5.18283 0.301339 4.89153 0 4.56006V12.5355C0 13.4194 0.723214 14.1426 1.60714 14.1426H16.3929C17.2768 14.1426 18 13.4194 18 12.5355V4.56006ZM18 1.60693C18 0.723004 17.2667 -0.00020957 16.3929 -0.00020957H1.60714C0.532366 -0.00020957 0 0.84354 0 1.82792C0 2.74198 1.01451 3.87702 1.72768 4.35917C3.2846 5.44399 4.86161 6.52881 6.41853 7.62367C7.07143 8.07568 8.17634 8.99979 8.98996 8.99979H9H9.01005C9.82366 8.99979 10.9286 8.07568 11.5815 7.62367C13.1384 6.52881 14.7154 5.44399 16.2824 4.35917C17.1663 3.74644 18 2.73193 18 1.60693Z"
                                    fill="#25DAC5" />
                            </svg><a href="mailto:info@designmodo.com">info@designmodo.com</a>
                        </div>
                    </div>
                    <div class="card2">
                        <h2 style="margin-bottom: 11px;">
                            Find Us on Map
                        </h2>
                        <p>
                            Via Salaria, 243, 00199 Rome
                        </p>
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7980932.216368826!2d57.287785652261455!3d12.38697867956729!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3c6f2dec3005d8ed%3A0x64af9837eaa5001c!2sArabian%20Sea!5e0!3m2!1sen!2sin!4v1789727091257!5m2!1sen!2sin"
                            width="370" height="230" style="border:0;" allowfullscreen="" loading="lazy"
                            referrerpolicy="strict-origin-when-cross-origin"></iframe>
                    </div>
                </div>
                <div class="col2">
                    <div class="card3">
                        <div class="h2">
                            <h1>You Can Mail Us</h1>
                        </div>
                        <P class="para">We are always looking for a next great project.</P>

                        <form action="">
                            <div class="mail">
                                <h1 class="mail">e-mail</h1>
                                <input class="dot" required type="email" name="" id="" placeholder="Your email">
                            </div>
                            <div class="message">
                                <h1 class="message">
                                    message
                                </h1>
                            </div>
                            <div>
                                <textarea required rows="7" name="" id="" placeholder="Drop us a line"></textarea>
                            </div>
                            <div class="name">
                                <h1 class="name ">name</h1>
                                <input style="margin-bottom: 10px;" type="name" name="" id=""
                                    placeholder="Your name"><button class="pose">Send</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
