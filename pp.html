<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Lato", sans-serif;
            background: #fff;
        }

        .split-page {
            min-height: 100vh;
            display: flex;
        }

        /* Left  */
        .left-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 40px 20px;
            position: relative;
        }

        .left-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url(iconbg.png);
            background-size: 1232px;
            background-position: center;
            background-size: inherit;
            opacity: 6%;
            z-index: 0;
        }

        .form-box {
            width: 100%;
            max-width: 380px;
            position: relative;
            z-index: 1;
        }

        /* Right */
        .sp2 {
            width: 50%;
            min-height: 100vh;
            background-color: #2563EB;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .sp2::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url(iconbg.png);
            background-size: cover;
            background-position: center;
            opacity: 6%;
            z-index: 0;
        }

        /* ==== Form Styles ==== */
        .form-box h2 {
            font-weight: 700;
            font-size: 1.85rem;
            color: #111;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: #5b6cff;
            box-shadow: 0 0 0 3px rgba(91, 108, 255, 0.2);
        }

        .btn-signin {
            background: linear-gradient(90deg, #5b6cff, #3b82f6);
            border: none;
            color: white;
            font-weight: 600;
            height: 48px;
            border-radius: 50px;
            width: 100%;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn-signin:hover {
            opacity: 0.9;
            color: white;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .btn-social {
            flex: 1;
            height: 46px;
            border: 1px solid #e5e7eb;
            background: white;
            color: #374151;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-social:hover {
            background: #f9fafb;
            color: #111;
            border-color: #d1d5db;
        }

        /* ==== Right === */
        .rp {
            position: relative;
            width: min(499px, 90%);
            aspect-ratio: 1/1;
            z-index: 1;
        }

        .circle {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .group {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: auto;
            z-index: 2;
        }

        .union {
            position: absolute;
            top: 50%;
            left: 32%;
            transform: translate(-50%, -50%);
            width: 43%;
            height: auto;
            z-index: 3;
        }

        .icon {
            position: absolute;
            width: 12.8%;
            height: auto;
            z-index: 4;
        }

        .fb {
            top: 14%;
            left: 2%;
        }

        .linkedin {
            top: 33%;
            left: 2%;
        }

        .instagram {
            top: 56%;
            left: 2%;
        }

        .twitter {
            top: 75%;
            left: 2%;
        }

        .card {
            position: absolute;
            top: 50%;
            left: 78%;
            transform: translate(-50%, -50%);
            width: 49.5%;
            height: auto;
            z-index: 5;
            object-fit: contain;
        }


        @media (max-width: 1400px) {
            .rp {
                width: min(440px, 85%);
            }
        }

        /* Tablets & below */
        @media (max-width: 992px) {
            .split-page {
                flex-direction: column;
            }

            .left-panel {
                width: 100%;
                min-height: auto;
                padding: 50px 24px;
            }

            .sp2 {
                width: 100%;
                min-height: 55vh;
                padding: 40px 20px;
            }

            .form-box {
                max-width: 420px;
            }

            .rp {
                width: min(380px, 80%);
            }
        }

        /* Mobile */
        @media (max-width: 576px) {
            .left-panel {
                padding: 40px 20px;
            }

            .form-box h2 {
                font-size: 1.6rem;
            }

            .btn-social {
                font-size: 0.9rem;
                height: 44px;
            }

            .sp2 {
                min-height: 50vh;
            }

            .rp {
                width: min(320px, 90%);
            }

            .fb {
                top: 12%;
                left: 1%;
            }

            .linkedin {
                top: 32%;
                left: 1%;
            }

            .instagram {
                top: 54%;
                left: 1%;
            }

            .twitter {
                top: 74%;
                left: 1%;
            }
        }

        /*  small phones */
        @media (max-width: 400px) {
            .form-box {
                max-width: 100%;
            }

            .btn-social span {
                display: none;
            }

            .btn-social {
                gap: 0;
            }
        }
    </style>
</head>
